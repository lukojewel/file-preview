name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Drift gate first: fail if the committed standalone/ does not match src/,
      # so the tests below exercise the file that would actually ship.
      - run: npm run build:check
      - run: npm run test
      - run: npm run build
